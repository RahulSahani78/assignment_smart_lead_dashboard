services:
  mongo:
    image: mongo:7
    container_name: smartleads_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=smart_leads

  backend:
    build:
      context: ./backend
    container_name: smartleads_backend
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/smart_leads
      - JWT_SECRET=${JWT_SECRET:-please-change-me-in-prod}
      - JWT_EXPIRES_IN=7d
      - CLIENT_ORIGIN=http://localhost:8080,http://localhost:5173

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    container_name: smartleads_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo_data:
